<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المتجر | ملكة الأيفون</title>
<meta name="description" content="تسوّق موبايلات وجرابات ملكة الأيفون بأسعارها، وابعت طلبك على واتساب.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF5EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0907" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">

<meta property="og:description" content="تسوّق موبايلات وجرابات ملكة الأيفون بأسعارها، وابعت طلبك على واتساب.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Reem+Kufi:wght@500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<link rel="stylesheet" href="core/one.css">
<link rel="stylesheet" href="main/main.css">
<script src="core/config.js" defer></script>
<script src="core/lists.js" defer></script>
<script src="core/one.js" defer></script>
<script src="main/main.js" defer></script>
</head>
<body data-page="main">
<a class="skip" href="#page" data-t="skip">تخطّى للمحتوى</a>
<div class="announce" id="announce" role="status" hidden><span></span></div>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="img/logo.webp" width="44" height="44" alt="" decoding="async">
      <span class="brand-name" data-brand-name>ملكة الأيفون</span>
    </a>
    <nav class="nav" aria-label="القائمة" data-t-al="menu">
      <a href="index.html" data-t="home">الرئيسية</a>
      <a href="main.html" aria-current="page" data-t="shop">المتجر</a>
    </nav>
    <div class="top-act">
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch to English"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/></svg><span>English</span></button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل الثيم">
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>
<main id="page">
  <section class="shop-hero">
    <div class="hero-bg" aria-hidden="true"><span class="blob b1"></span></div>
    <div class="wrap">
      <p class="eyebrow"><span class="dot"></span><span data-t="shopEyebrow">المتجر</span></p>
      <h1 class="shop-title" data-t="shopTitle">اختار. أضف. اطلب.</h1>
      <p class="sec-sub" data-t="shopSub">كل المنتجات بأسعارها، والطلب بيوصلنا على واتساب.</p>
    </div>
  </section>
  <div class="wrap">
    <div class="toolbar" id="toolbar">
      <label class="search">
        <span class="sr" data-t="search">ابحث عن منتج</span>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="ابحث عن موبايل أو جراب…" data-t-ph="searchPh" autocomplete="off" enterkeyhint="search" maxlength="60">
      </label>
      <div class="cats" id="cats" role="group" aria-label="الأقسام" data-t-al="cats" hidden></div>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <div id="shop" class="shop-area">
      <div class="grid" aria-hidden="true">
        <div class="card skel"></div><div class="card skel"></div><div class="card skel"></div><div class="card skel"></div>
        <div class="card skel"></div><div class="card skel"></div><div class="card skel"></div><div class="card skel"></div>
      </div>
    </div>
  </div>

  <section class="case-req wrap" id="caseReq" aria-labelledby="caseTitle"></section>

  <div class="cartbar" id="cartbar" hidden><button type="button" id="cartOpen" aria-haspopup="dialog"></button></div>

  <dialog class="sheet" id="pd" aria-labelledby="pdHead">
    <div class="sheet-head"><h2 id="pdHead" data-t="pdHead">تفاصيل المنتج</h2><button class="close" type="button" data-close data-t-al="close" aria-label="إغلاق"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-body" id="pdBody"></div>
    <div class="sheet-foot" id="pdFoot"></div>
  </dialog>

  <dialog class="sheet" id="cart" aria-labelledby="cartHead">
    <div class="sheet-head"><h2 id="cartHead" data-t="cartHead">طلبك</h2><button class="close" type="button" data-close data-t-al="close" aria-label="إغلاق"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-body">
      <div class="lines" id="cartLines"></div>
      <div class="sums">
        <div class="sum-r"><span data-t="subTotal">المنتجات</span><span id="cartSub"></span></div>
        <div class="sum-r" id="shipRow"><span data-t="shipFee">الشحن</span><span id="cartShip"></span></div>
        <div class="total"><span data-t="grand">الإجمالي</span><span class="v" id="cartTotal"></span></div>
      </div>
      <p class="note-s" id="cartNote" hidden></p>
      <form class="form" id="orderForm" novalidate>
        <p class="req-hint" data-t="reqHint">الحقول اللي عليها * لازم تتملى.</p>
        <label><span><span data-t="fName">الاسم</span> <b class="star" aria-hidden="true">*</b></span>
          <input id="fName" name="name" type="text" autocomplete="name" maxlength="60" required aria-required="true">
          <span class="err" id="fNameErr" data-t="fNameErr" hidden>اكتب اسمك عشان نعرف نكلمك.</span>
        </label>
        <label><span><span data-t="fPhone">رقم موبايل تاني للتواصل</span> <b class="star" aria-hidden="true">*</b></span>
          <input id="fPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" dir="ltr" placeholder="01xxxxxxxxx" required aria-required="true">
          <span class="hint" data-t="fPhoneHint">رقم غير رقم الواتساب اللي هتبعت منه، عشان لو مقدرناش نوصلك.</span>
          <span class="err" id="fPhoneErr" data-t="fPhoneErr" hidden>اكتب رقم موبايل صحيح.</span>
        </label>
        <fieldset class="method" id="fMethod">
          <legend><span data-t="fMethod">طريقة الاستلام</span> <b class="star" aria-hidden="true">*</b></legend>
          <div class="seg">
            <label class="seg-o" id="mDelWrap"><input type="radio" name="method" value="delivery" checked><span class="seg-b"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h11v10H3zM14 9h4l3 3.5V16h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/></svg><b data-t="mDel">توصيل</b><small data-t="mDelS">لحد باب البيت</small></span></label>
            <label class="seg-o" id="mPickWrap"><input type="radio" name="method" value="pickup"><span class="seg-b"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16M9 20v-6h6v6"/></svg><b data-t="mPick">استلام من المحل</b><small data-t="mPickS">من غير مصاريف شحن</small></span></label>
          </div>
        </fieldset>
        <label id="fGovWrap"><span><span data-t="fGov">المحافظة</span> <b class="star" aria-hidden="true">*</b></span>
          <select id="fGov" name="gov" required aria-required="true"></select>
          <span class="err" id="fGovErr" data-t="fGovErr" hidden>اختار المحافظة.</span>
        </label>
        <div class="pick-info" id="pickInfo" hidden></div>
        <label id="fAddrWrap"><span><span data-t="fAddr">العنوان</span> <b class="star" aria-hidden="true">*</b></span>
          <input id="fAddr" name="address" type="text" autocomplete="street-address" maxlength="200" required aria-required="true">
          <span class="err" id="fAddrErr" data-t="fAddrErr" hidden>اكتب عنوانك بالتفصيل.</span>
        </label>
        <label><span data-t="fNote">ملاحظات (اختياري)</span>
          <textarea id="fNote" name="note" maxlength="300"></textarea>
        </label>
      </form>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-main btn-block" type="button" id="sendOrder">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
        <span data-t="send">إرسال الطلب على واتساب</span>
      </button>
      <button class="btn btn-ghost btn-block" type="button" id="clearCart" data-t="clear">تفريغ السلة</button>
    </div>
  </dialog>
</main>
<footer class="foot" id="foot"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
