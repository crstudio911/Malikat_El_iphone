<section class="hero" aria-labelledby="heroTitle">
  <div class="hero-head">
    <div class="hero-text">
      <h1 class="hero-title" id="heroTitle">آيفون. بسعر يليق بيك.</h1>
      <p class="hero-sub">موبايلات أصلية وجرابات فاخرة — اختار، واطلب على واتساب في ثواني.</p>
    </div>
    <div class="hero-cta">
      <a class="pill" href="#shop" data-go="shop">تسوّق دلوقتي</a>
      <a class="more" href="#fan">اكتشف أكتر<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    </div>
  </div>
  <div class="deck-track" id="deckTrack">
    <div class="deck-pin">
      <div class="deck" id="deck" role="list" aria-label="أحدث الموبايلات والجرابات"></div>
      <p class="deck-hint" id="deckHint"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>انزل لتحت عشان الكروت تتفرد</p>
    </div>
  </div>
</section>

<section class="fan-sec" id="fan" aria-labelledby="fanTitle">
  <div class="fan-copy">
    <h2 class="fan-title" id="fanTitle">كل ألوانك. في مكان واحد.</h2>
    <p class="fan-sub">موبايلات وجرابات بكل الألوان اللي تحبها، بضمان وأسعار ملكة.</p>
  </div>
  <div class="fan-stage" id="fanStage" aria-hidden="true">
    <div class="fan-panels" id="fanPanels"></div>
    <img class="dev dev-tab" src="img/products/tablet-silver.webp" alt="" width="738" height="900" loading="lazy" decoding="async">
    <img class="dev dev-phone" src="img/products/phone-front.webp" alt="" width="497" height="900" loading="lazy" decoding="async">
    <img class="dev dev-watch" src="img/products/watch.webp" alt="" width="600" height="900" loading="lazy" decoding="async">
  </div>
</section>

<div class="toolbar">
  <label class="search">
    <span class="sr">ابحث عن منتج</span>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ابحث عن موبايل أو جراب…" autocomplete="off" enterkeyhint="search" maxlength="60">
  </label>
  <div class="cats" id="cats" role="group" aria-label="الأقسام" hidden></div>
</div>

<p class="count" id="count" aria-live="polite"></p>

<div id="shop" class="shop-anchor">
  <div class="grid" aria-hidden="true">
    <div class="card skel"></div><div class="card skel"></div><div class="card skel"></div>
    <div class="card skel"></div><div class="card skel"></div><div class="card skel"></div>
  </div>
</div>

<div class="cartbar" id="cartbar" hidden>
  <button type="button" id="cartOpen" aria-haspopup="dialog"></button>
</div>
<dialog class="sheet" id="pd" aria-labelledby="pdHead">
  <div class="sheet-head">
    <h2 id="pdHead">تفاصيل المنتج</h2>
    <button class="close" type="button" data-close aria-label="إغلاق">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="pdBody"></div>
  <div class="sheet-foot" id="pdFoot"></div>
</dialog>
<dialog class="sheet" id="cart" aria-labelledby="cartHead">
  <div class="sheet-head">
    <h2 id="cartHead">طلبك</h2>
    <button class="close" type="button" data-close aria-label="إغلاق">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <div class="lines" id="cartLines"></div>
    <div class="total"><span>الإجمالي</span><span class="v" id="cartTotal"></span></div>
    <p class="note-s" id="cartNote" hidden></p>
    <form class="form" id="orderForm" novalidate>
      <label>الاسم
        <input id="fName" name="name" type="text" autocomplete="name" maxlength="60" required>
        <span class="err" id="fNameErr" hidden>اكتب اسمك عشان نعرف نكلمك.</span>
      </label>
      <label id="fAddrWrap">العنوان
        <input id="fAddr" name="address" type="text" autocomplete="street-address" maxlength="200">
      </label>
      <label>ملاحظات (اختياري)
        <textarea id="fNote" name="note" maxlength="300"></textarea>
      </label>
    </form>
  </div>
  <div class="sheet-foot">
    <button class="btn btn-gold btn-block" type="button" id="sendOrder">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.25-1.38A9.9 9.9 0 1 0 12.04 2zm5.8 14.1c-.25.7-1.45 1.33-2 1.4-.52.07-1.17.1-1.88-.12a17 17 0 0 1-1.7-.63c-3-1.3-4.95-4.32-5.1-4.52-.15-.2-1.2-1.6-1.2-3.04 0-1.45.76-2.16 1.03-2.45.27-.3.6-.37.8-.37h.58c.18 0 .43-.07.67.5.25.6.84 2.06.92 2.2.07.15.12.32.02.52-.1.2-.15.32-.3.5l-.45.52c-.15.15-.3.31-.13.6.17.3.77 1.27 1.65 2.05 1.13 1 2.08 1.32 2.38 1.47.3.15.47.12.65-.07.17-.2.75-.87.95-1.17.2-.3.4-.25.67-.15.27.1 1.72.8 2.02.96.3.15.5.22.57.35.07.12.07.7-.18 1.4z"/></svg>
      <span>إرسال الطلب على واتساب</span>
    </button>
    <button class="btn btn-line btn-block" type="button" id="clearCart">تفريغ السلة</button>
  </div>
</dialog>
